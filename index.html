<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🔥 Akash Facts</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#080808,#171717);
  color:white;
  text-align:center;
}

header{
  padding:25px 15px;
  background:linear-gradient(135deg,#ff9800,#ff5722);
}

.logo{
  font-size:42px;
}

h1{
  margin:5px 0;
  font-size:34px;
}

.subtitle{
  margin:8px 0;
  font-size:16px;
}

.container{
  max-width:700px;
  margin:auto;
  padding:20px;
}

select,input{
  width:100%;
  padding:14px;
  margin:7px 0;
  border:0;
  border-radius:12px;
  font-size:16px;
}

.fact-box{
  margin:20px 0;
  padding:30px 20px;
  min-height:150px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#222;
  border-radius:20px;
  box-shadow:0 5px 20px #000;
  font-size:21px;
  line-height:1.6;
}

button{
  padding:13px 18px;
  margin:5px;
  border:0;
  border-radius:12px;
  background:#ff9800;
  color:#111;
  font-size:16px;
  font-weight:bold;
}

button:active{
  transform:scale(.95);
}

.buttons{
  margin:10px 0;
}

.card{
  margin-top:25px;
  padding:20px;
  background:#1f1f1f;
  border-radius:18px;
}

.card h2{
  margin-top:0;
}

footer{
  margin-top:30px;
  padding:20px;
  background:#111;
  color:#aaa;
}
</style>
</head>

<body>

<header>
  <div class="logo">🔥</div>
  <h1>Akash Facts</h1>
  <div class="subtitle">दुनिया के Interesting Facts एक जगह 🚀</div>
</header>

<div class="container">

  <div class="card">
    <h2>🔎 Fact Category</h2>

    <select id="category">
      <option value="all">🌍 सभी Facts</option>
      <option value="science">🔬 Science</option>
      <option value="space">🚀 Space</option>
      <option value="animals">🐯 Animals</option>
      <option value="technology">💻 Technology</option>
    </select>
  </div>

  <div class="fact-box" id="fact">
    नीचे दिए गए बटन को दबाकर Amazing Fact देखो! 👇
  </div>

  <button onclick="showFact()">🚀 Next Fact</button>

  <div class="buttons">
    <button onclick="likeFact()">❤️ Like</button>
    <button onclick="copyFact()">📋 Copy</button>
    <button onclick="shareFact()">📤 Share</button>
  </div>

  <p id="likes">❤️ Likes: 0</p>

  <div class="card">
    <h2>➕ अपना Fact जोड़ें</h2>

    <input id="newFact" placeholder="अपना Fact लिखें">

    <button onclick="addFact()">➕ Add Fact</button>
  </div>

  <div class="card">
    <h2>🔍 Fact Search</h2>

    <input id="searchFact" placeholder="Fact खोजें">

    <button onclick="searchFacts()">🔎 Search</button>

    <div id="results"></div>
  </div>

</div>

<footer>
  🔥 Akash Facts © 2026
  <br>
  Learn • Discover • Share 🚀
</footer>

<script>

const facts = [

{
text:"🌍 पृथ्वी सूर्य का चक्कर लगभग 365 दिनों में लगाती है।",
category:"science"
},

{
text:"🧠 इंसान का दिमाग बहुत जटिल अंग है और इसमें अरबों neurons होते हैं।",
category:"science"
},

{
text:"🌙 चंद्रमा पृथ्वी का प्राकृतिक उपग्रह है।",
category:"space"
},

{
text:"☀️ सूर्य हमारे सौरमंडल का तारा है।",
category:"space"
},

{
text:"🐘 हाथी अपनी याददाश्त के लिए प्रसिद्ध हैं।",
category:"animals"
},

{
text:"🐝 मधुमक्खियाँ फूलों से nectar इकट्ठा करती हैं।",
category:"animals"
},

{
text:"💻 इंटरनेट दुनिया भर के कंप्यूटरों और नेटवर्कों को जोड़ता है।",
category:"technology"
},

{
text:"📱 स्मार्टफोन आज communication और information के लिए बहुत उपयोगी उपकरण हैं।",
category:"technology"
}

];

function showFact(){

const category =
document.getElementById("category").value;

let list = facts;

if(category !== "all"){
list = facts.filter(
fact => fact.category === category
);
}

if(list.length === 0){
document.getElementById("fact").innerText =
"❌ इस category में अभी Fact नहीं है!";
return;
}

const random =
Math.floor(Math.random()*list.length);

document.getElementById("fact").innerText =
list[random].text;

}

let likes = 0;

function likeFact(){

likes++;

document.getElementById("likes").innerText =
"❤️ Likes: " + likes;

}

function copyFact(){

const text =
document.getElementById("fact").innerText;

navigator.clipboard.writeText(text);

alert("📋 Fact copied!");

}

function shareFact(){

const text =
document.getElementById("fact").innerText;

if(navigator.share){

navigator.share({
title:"Akash Facts",
text:text
});

}else{

alert("📤 Share इस browser में उपलब्ध नहीं है।");

}

}

function addFact(){

const input =
document.getElementById("newFact");

const text =
input.value.trim();

if(text === ""){

alert("पहले Fact लिखो!");

return;

}

facts.push({
text:"💡 " + text,
category:"science"
});

input.value="";

alert("✅ आपका Fact जोड़ दिया गया!");

}

function searchFacts(){

const search =
document.getElementById("searchFact")
.value
.toLowerCase()
.trim();

const results =
facts.filter(fact =>
fact.text.toLowerCase().includes(search)
);

const box =
document.getElementById("results");

if(results.length === 0){

box.innerText="❌ कोई Fact नहीं मिला!";

return;

}

box.innerHTML =
results
.map(fact => "💡 " + fact.text)
.join("<br><br>");

}

</script>

</body>
</html>
