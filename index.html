<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#fff7ed,#ffe4e6);
  color:#222;
  min-height:100vh;
  transition:0.3s;
}

header{
  background:linear-gradient(135deg,#ff6b00,#e11d48);
  color:white;
  text-align:center;
  padding:30px 15px;
}

header h1{

}

header p{

}

.container{

  margin:auto;
  padding:20px;
}

.card{
  background:white;
  border-radius:20px;
  padding:25px;
  margin-top:20px;
  box-shadow:0 8px 25px rgba(0,0,0,0.12);
}

#fact{
  font-size:22px;
  line-height:1.6;
  text-align:center;
  min-height:120px;
  display:flex;
  align-items:center;
  justify-content:center;
}

select,
input{
  width:100%;
  padding:14px;
  border:1px solid #ddd;
  border-radius:12px;
  font-size:16px;
  margin-top:8px;
  outline:none;
}

button{
  border:0;
  border-radius:12px;
  padding:13px 18px;
  margin:6px 3px;
  font-size:15px;
  cursor:pointer;
  background:#ff6b00;
  color:white;
}

button:hover{
  opacity:0.85;
}

.buttons{
  text-align:center;
  margin-top:15px;
}

.next{
  width:100%;
  font-size:18px;
  padding:16px;
  background:#e11d48;
}

.section-title{
  margin-top:25px;
}

.result{
  background:#fff7ed;
  padding:12px;
  border-radius:10px;
  margin-top:8px;
}

footer{
  text-align:center;
  padding:25px;
  margin-top:20px;
  color:#666;
}

/* Dark Mode */

body.dark{
  background:#111827;
  color:white;
}

body.dark .card{
  background:#1f2937;
}

body.dark input,
body.dark select{
  background:#374151;
  color:white;
  border-color:#4b5563;
}

body.dark .result{
  background:#374151;
}

body.dark footer{
  color:#bbb;
}
</style>
</head>

</header>

<div class="container">

    <div id="fact">
      🔥 Welcome to Akash Facts!
    </div>

    <button class="next" onclick="showFact()">
      🚀 Next Fact
    </button>

    <div class="buttons">

      <button onclick="likeFact()">
        ❤️ Like
      </button>

      <button onclick="copyFact()">
        📋 Copy
      </button>

      <button onclick="shareFact()">
        📤 Share
      </button>

      <button onclick="toggleMode()">

      </button>

    </div>

    <p id="likes" style="text-align:center;">

  <div class="card">

    <h3 class="section-title">
      ➕ अपना Fact जोड़ें
    </h3>

    <input

      type="text"
      placeholder="अपना interesting fact लिखें..."
    >

    <button onclick="addFact()">

  </div>


  <div class="card">

    <h3 class="section-title">
      🔍 Fact Search

    <input
      id="searchFact"
      type="text"
      placeholder="Fact खोजें..."
      oninput="searchFacts()"
    >

    <div id="results"></div>

  </div>

</div>

<footer>

/* SHOW FACT */

function showFact(){

  const category =
  document.getElementById("category").value;

  let filtered = facts;

  if(category !== "all"){
    filtered = facts.filter(
      fact => fact.category === category
    );
  }

  if(filtered.length === 0){
    document.getElementById("fact").innerText =
    "❌ इस category में कोई Fact नहीं है।";
    return;
  }

  const random =
  Math.floor(Math.random() * filtered.length);

  document.getElementById("fact").innerText =
  filtered[random].text;
}


/* LIKE */

function likeFact(){

  likes++;

  document.getElementById("likes").innerText =
  "❤️ Likes: " + likes;
}


/* COPY */

function copyFact(){

  const text =
  document.getElementById("fact").innerText;

  navigator.clipboard.writeText(text)
  .then(()=>{
    alert("📋 Fact copied!");
  })
  .catch(()=>{
    alert("Copy नहीं हो पाया।");
  });
}


/* SHARE */

function shareFact(){

  const text =
  document.getElementById("fact").innerText;

  if(navigator.share){

    navigator.share({
      title:"Akash Facts",
      text:text
    });

  }else{

    alert("📤 इस browser में Share उपलब्ध नहीं है।");

  }
}


/* DARK MODE */

function toggleMode(){

  document.body.classList.toggle("dark");

}


/* ADD FACT */

async function addFact(){

  const input =
  document.getElementById("newFact");

  const text =
  input.value.trim();

  if(text === ""){

    alert("पहले Fact लिखो!");

    return;
  }

  facts.push({
    text:"💡 " + text,
    category:"science"
  });
  await window.saveFact(text);

  input.value="";

  alert("✅ आपका Fact जोड़ दिया गया!");

  showFact();
}


/* SEARCH */

function searchFacts(){

  const search =
  document.getElementById("searchFact")
  .value
  .toLowerCase()
  .trim();

  const box =
  document.getElementById("results");

  if(search === ""){

    box.innerHTML="";
    return;

  }

  const results =
  facts.filter(
    fact => fact.text.toLowerCase().includes(search)
  );

  if(results.length === 0){

    box.innerHTML =
    "<div class='result'>❌ कोई Fact नहीं मिला।</div>";

    return;
  }

  box.innerHTML =
  results.map(
    fact => "<div class='result'>" +
    fact.text +
    "</div>"
  ).join("");

}


/* FIRST FACT */

showFact();
