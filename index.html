<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔥 Akash Facts</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#0b0b0f;
  color:white;
}

header{
  background:linear-gradient(135deg,#ff9800,#ff3d00);
  text-align:center;
  padding:45px 20px;
}

.logo{
  font-size:55px;
}

h1{
  font-size:42px;
  margin:10px 0;
}

.subtitle{
  font-size:20px;
}

.container{
  max-width:700px;
  margin:auto;
  padding:25px 15px;
}

.card{
  background:#18181d;
  border-radius:22px;
  padding:25px;
  margin:20px 0;
  box-shadow:0 8px 25px rgba(0,0,0,.35);
}

h2{
  text-align:center;
}

select,input{
  width:100%;
  padding:15px;
  border:0;
  border-radius:12px;
  font-size:16px;
  margin-top:10px;
}

.fact{
  min-height:150px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  font-size:23px;
  line-height:1.5;
}

button{
  border:0;
  border-radius:12px;
  padding:14px 20px;
  margin:6px;
  font-size:16px;
  font-weight:bold;
  background:#ff9800;
  cursor:pointer;
}

button:active{
  transform:scale(.96);
}

.main-btn{
  display:block;
  margin:10px auto;
  font-size:19px;
  padding:16px 30px;
}

.buttons{
  text-align:center;
}

.likes{
  text-align:center;
  font-size:18px;
}

.result{
  background:#25252b;
  padding:15px;
  border-radius:12px;
  margin-top:10px;
  line-height:1.5;
}

footer{
  text-align:center;
  padding:30px 15px;
  color:#aaa;
}

.light{
  background:#f4f4f4;
  color:#111;
}

.light .card{
  background:white;
}

.light .result{
  background:#eee;
}

.mode{
  position:absolute;
  right:15px;
  top:15px;
  background:rgba(0,0,0,.35);
  color:white;
}
</style>
</head>

<body>

<button class="mode" onclick="toggleMode()">🌙 Mode</button>

<header>
  <div class="logo">🔥</div>
  <h1>Akash Facts</h1>
  <div class="subtitle">
    दुनिया के Interesting Facts एक जगह 🚀
  </div>
</header>

<div class="container">

  <div class="card">
    <h2>🔎 Fact Category</h2>

    <select id="category">
      <option value="all">🌍 सभी Facts</option>
      <option value="science">🔬 Science</option>
      <option value="space">🚀 Space</option>
      <option value="animals">🐯 Animals</option>
      <option value="technology">💻 Technology</option>
    </select>
  </div>

  <div class="card">
    <div class="fact" id="fact">
      नीचे दिए गए बटन को दबाकर Amazing Fact देखो! 👇
    </div>

    <button class="main-btn" onclick="showFact()">
      🚀 Next Fact
    </button>

    <div class="buttons">
      <button onclick="likeFact()">❤️ Like</button>
      <button onclick="copyFact()">📋 Copy</button>
      <button onclick="shareFact()">📤 Share</button>
    </div>

    <div class="likes" id="likes">
      ❤️ Likes: 0
    </div>
  </div>

  <div class="card">
    <h2>➕ अपना Fact जोड़ें</h2>

    <input
      type="text"
      id="newFact"
      placeholder="अपना Fact लिखें"
    >

    <div class="buttons">
      <button onclick="addFact()">➕ Add Fact</button>
    </div>
  </div>

  <div class="card">
    <h2>🔍 Fact Search</h2>

    <input
      type="text"
      id="searchFact"
      placeholder="Fact खोजें..."
    >

    <div class="buttons">
      <button onclick="searchFacts()">🔍 Search</button>
    </div>

    <div id="results"></div>
  </div>

</div>

<footer>
  🔥 Akash Facts © 2026<br>
  Interesting Facts • Science • Space • Technology
</footer>

<script>

const facts = [

{
 text:"🌍 पृथ्वी सूर्य का एक चक्कर लगभग 365 दिनों में पूरा करती है।",
 category:"science"
},

{
 text:"🧠 मानव मस्तिष्क शरीर के सबसे जटिल अंगों में से एक है।",
 category:"science"
},

{
 text:"🌙 चंद्रमा पृथ्वी का प्राकृतिक उपग्रह है।",
 category:"space"
},

{
 text:"☀️ सूर्य हमारे सौरमंडल का सबसे बड़ा पिंड है।",
 category:"space"
},

{
 text:"🚀 अंतरिक्ष में हवा न होने के कारण ध्वनि सामान्य तरीके से यात्रा नहीं करती।",
 category:"space"
},

{
 text:"🐘 हाथी अपनी याददाश्त के लिए प्रसिद्ध हैं।",
 category:"animals"
},

{
 text:"🐝 मधुमक्खियाँ फूलों से nectar इकट्ठा करती हैं।",
 category:"animals"
},

{
 text:"🐬 डॉल्फिन बहुत बुद्धिमान समुद्री जीवों में गिनी जाती हैं।",
 category:"animals"
},

{
 text:"💻 इंटरनेट दुनिया भर के कंप्यूटर नेटवर्क को जोड़ता है।",
 category:"technology"
},

{
 text:"📱 स्मार्टफोन एक ही डिवाइस में कई तरह के डिजिटल काम कर सकता है।",
 category:"technology"
}

];

let likes = 0;

function showFact(){

 const category =
 document.getElementById("category").value;

 let filtered = facts;

 if(category !== "all"){
   filtered = facts.filter(
     f => f.category === category
   );
 }

 if(filtered.length === 0){
   document.getElementById("fact").innerText =
   "❌ इस category में अभी कोई Fact नहीं है।";
   return;
 }

 const random =
 Math.floor(Math.random()*filtered.length);

 document.getElementById("fact").innerText =
 filtered[random].text;
}

function likeFact(){

 likes++;

 document.getElementById("likes").innerText =
 "❤️ Likes: " + likes;
}

function copyFact(){

 const text =
 document.getElementById("fact").innerText;

 navigator.clipboard.writeText(text)
 .then(()=>{
   alert("📋 Fact copied!");
 })
 .catch(()=>{
   alert("Copy नहीं हो पाया।");
 });
}

function shareFact(){

 const text =
 document.getElementById("fact").innerText;

 if(navigator.share){

   navigator.share({
     title:"Akash Facts",
     text:text
   });

 }else{

   alert("📤 Share इस browser में उपलब्ध नहीं है।");
 }
}

function toggleMode(){

 document.body.classList.toggle("light");

}

function addFact(){

 const input =
 document.getElementById("newFact");

 const text =
 input.value.trim();

 if(text === ""){

   alert("पहले Fact लिखो!");

   return;
 }

 facts.push({
   text:"💡 " + text,
   category:"science"
 });

 input.value="";

 alert("✅ आपका Fact जोड़ दिया गया!");
}

function searchFacts(){

 const search =
 document.getElementById("searchFact")
 .value
 .toLowerCase()
 .trim();

 const results =
 facts.filter(f =>
   f.text.toLowerCase().includes(search)
 );

 const box =
 document.getElementById("results");

 if(results.length === 0){

   box.innerHTML =
   "<div class='result'>❌ कोई Fact नहीं मिला!</div>";

   return;
 }

 box.innerHTML =
 results.map(f =>
   "<div class='result'>💡 "+f.text+"</div>"
 ).join("");
}

</script>

</body>
</html>
