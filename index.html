<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔥 Akash Facts</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #111827, #1e1b4b);
  color: white;
  min-height: 100vh;
  text-align: center;
}

header {
  padding: 30px 15px 20px;
}

.logo {
  font-size: 45px;
}

h1 {
  margin: 5px 0;
  font-size: 34px;
}

.subtitle {
  color: #cbd5e1;
  margin-top: 8px;
}

.container {
  max-width: 650px;
  margin: auto;
  padding: 15px;
}

.controls {
  margin: 15px 0;
}

select,
input {
  width: 100%;
  padding: 14px;
  margin: 7px 0;
  border: none;
  border-radius: 12px;
  font-size: 16px;
  outline: none;
}

.fact-box {
  background: rgba(255,255,255,0.10);
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 20px;
  padding: 30px 20px;
  margin: 20px 0;
  min-height: 150px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 21px;
  line-height: 1.6;
  backdrop-filter: blur(10px);
}

button {
  border: none;
  border-radius: 12px;
  padding: 13px 18px;
  margin: 5px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  background: #f97316;
  color: white;
}

button:hover {
  opacity: 0.85;
}

.next {
  width: 90%;
  font-size: 18px;
  background: #8b5cf6;
}

.buttons {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
}

.section {
  background: rgba(255,255,255,0.08);
  border-radius: 18px;
  padding: 20px;
  margin-top: 25px;
}

.results {
  text-align: left;
  margin-top: 15px;
}

.result {
  background: rgba(255,255,255,0.08);
  padding: 12px;
  margin: 8px 0;
  border-radius: 10px;
}

footer {
  padding: 30px 10px;
  color: #94a3b8;
  font-size: 14px;
}

#likes {
  color: #fb7185;
  font-weight: bold;
}
</style>
</head>

<body>

<header>
  <div class="logo">🔥</div>
  <h1>Akash Facts</h1>
  <p class="subtitle">हर दिन कुछ नया सीखो 🚀</p>
</header>

<div class="container">

  <div class="controls">
    <select id="category">
      <option value="all">🌍 सभी Facts</option>
      <option value="science">🔬 Science</option>
      <option value="space">🚀 Space</option>
      <option value="animals">🐯 Animals</option>
      <option value="technology">💻 Technology</option>
    </select>
  </div>

  <div class="fact-box" id="fact">
    👇 Next Fact दबाकर एक Interesting Fact देखो!
  </div>

  <button class="next" onclick="showFact()">🚀 Next Fact</button>

  <div class="buttons">
    <button onclick="likeFact()">❤️ Like</button>
    <button onclick="copyFact()">📋 Copy</button>
    <button onclick="shareFact()">📤 Share</button>
  </div>

  <p id="likes">❤️ Likes: 0</p>

  <div class="section">
    <h2>🔍 Fact Search</h2>

    <input
      type="text"
      id="searchFact"
      placeholder="Fact खोजें..."
    >

    <button onclick="searchFacts()">🔎 Search</button>

    <div class="results" id="results"></div>
  </div>

  <div class="section">
    <h2>➕ अपना Fact जोड़ें</h2>

    <input
      type="text"
      id="newFact"
      placeholder="अपना Interesting Fact लिखें..."
    >

    <button onclick="addFact()">➕ Add Fact</button>
  </div>

</div>

<footer>
  © 2026 Akash Facts 🚀
</footer>

<script>

const facts = [

  {
    text: "🌍 पृथ्वी सूर्य का एक चक्कर लगभग 365 दिनों में पूरा करती है।",
    category: "science"
  },

  {
    text: "🧠 इंसान का दिमाग शरीर के सबसे जटिल अंगों में से एक है।",
    category: "science"
  },

  {
    text: "💧 पानी सामान्य परिस्थितियों में लगभग 100°C पर उबलता है।",
    category: "science"
  },

  {
    text: "🌙 चंद्रमा पृथ्वी का प्राकृतिक उपग्रह है।",
    category: "space"
  },

  {
    text: "☀️ सूर्य हमारे सौरमंडल का तारा है।",
    category: "space"
  },

  {
    text: "🚀 अंतरिक्ष में आवाज़ सामान्य वातावरण की तरह यात्रा नहीं कर सकती।",
    category: "space"
  },

  {
    text: "🐘 हाथी अपनी याददाश्त के लिए प्रसिद्ध हैं।",
    category: "animals"
  },

  {
    text: "🐝 मधुमक्खियाँ फूलों से nectar इकट्ठा करती हैं।",
    category: "animals"
  },

  {
    text: "🐬 डॉल्फिन बहुत बुद्धिमान समुद्री जीवों में गिनी जाती हैं।",
    category: "animals"
  },

  {
    text: "💻 HTML का उपयोग webpages की संरचना बनाने के लिए किया जाता है।",
    category: "technology"
  },

  {
    text: "📱 आधुनिक smartphones में computer जैसी कई सुविधाएँ होती हैं।",
    category: "technology"
  },

  {
    text: "🤖 AI का उपयोग कई अलग-अलग क्षेत्रों में किया जाता है।",
    category: "technology"
  }

];

let likes = 0;

function showFact() {

  const category =
    document.getElementById("category").value;

  let filteredFacts = facts;

  if (category !== "all") {
    filteredFacts = facts.filter(
      fact => fact.category === category
    );
  }

  if (filteredFacts.length === 0) {
    document.getElementById("fact").innerText =
      "❌ इस category में अभी कोई Fact नहीं है।";
    return;
  }

  const random =
    Math.floor(Math.random() * filteredFacts.length);

  document.getElementById("fact").innerText =
    filteredFacts[random].text;
}

function likeFact() {

  likes++;

  document.getElementById("likes").innerText =
    "❤️ Likes: " + likes;
}

function copyFact() {

  const fact =
    document.getElementById("fact").innerText;

  navigator.clipboard.writeText(fact);

  alert("📋 Fact copied!");
}

function shareFact() {

  const fact =
    document.getElementById("fact").innerText;

  if (navigator.share) {

    navigator.share({
      title: "Akash Facts",
      text: fact
    });

  } else {

    alert("📤 Share इस browser में उपलब्ध नहीं है।");
  }
}

function searchFacts() {

  const search =
    document.getElementById("searchFact")
    .value
    .toLowerCase()
    .trim();

  const box =
    document.getElementById("results");

  if (search === "") {
    box.innerHTML = "";
    return;
  }

  const results =
    facts.filter(fact =>
      fact.text.toLowerCase().includes(search)
    );

  if (results.length === 0) {

    box.innerHTML =
      "❌ कोई Fact नहीं मिला।";

    return;
  }

  box.innerHTML =
    results
      .map(fact =>
        `<div class="result">💡 ${fact.text}</div>`
      )
      .join("");
}

function addFact() {

  const input =
    document.getElementById("newFact");

  const text =
    input.value.trim();

  if (text === "") {

    alert("पहले Fact लिखो!");

    return;
  }

  facts.push({
    text: "💡 " + text,
    category: "science"
  });

  input.value = "";

  alert("✅ आपका Fact जोड़ दिया गया!");

}

</script>

</body>
  </html>
