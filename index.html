<!DOCTYPE html><html><head>  <title>Akash Facts</title>  <style>    body {      font-family: Arial;      background: #111;      color: white;      text-align: center;      padding: 20px;      transition: 0.3s;    }    h1 {      color: orange;      font-size: 32px;    }    select, input {      padding: 12px;      border-radius: 8px;      border: none;      font-size: 16px;      margin: 6px;    }    .fact {      background: #222;      padding: 25px;      border-radius: 15px;      margin: 20px 0;      font-size: 20px;      min-height: 50px;    }    button {      padding: 12px 18px;      border: none;      border-radius: 10px;      background: orange;      font-size: 16px;      margin: 5px;      cursor: pointer;    }    .light {      background: white;      color: black;    }    .light .fact {      background: #eee;      color: black;    }    #results {      margin-top: 15px;    }  </style></head><body>  <button onclick="toggleMode()">🌙 / ☀️ Mode</button>  <h1>🔥 Akash Facts</h1>  <select id="category">    <option value="all">🌍 All Facts</option>    <option value="science">🔬 Science</option>    <option value="space">🚀 Space</option>    <option value="animals">🐯 Animals</option>  </select>  <div class="fact" id="fact">    नीचे दिए गए बटन को दबाकर Fact देखो! 👇  </div>  <button onclick="showFact()">Next Fact 🚀</button>  <div>    <button onclick="likeFact()">❤️ Like</button>    <button onclick="copyFact()">📋 Copy</button>    <button onclick="shareFact()">📤 Share</button>  </div>  <p id="likes">❤️ Likes: 0</p>  <hr>  <h2>➕ अपना Fact जोड़ें</h2>  <input type="text" id="newFact" placeholder="अपना Fact लिखें">  <button onclick="addFact()">➕ Add Fact</button>  <hr>  <h2>🔍 Fact Search</h2>  <input type="text" id="searchFact" placeholder="Fact खोजें">  <button onclick="searchFacts()">Search 🔍</button>  <div id="results"></div>  <script>    const facts = [      {        text: "🌍 पृथ्वी सूर्य का चक्कर लगभग 365 दिनों में लगाती है।",        category: "science"      },      {        text: "🧠 इंसान का दिमाग शरीर के सबसे महत्वपूर्ण अंगों में से एक है।",        category: "science"      },      {        text: "🌙 चंद्रमा पृथ्वी का प्राकृतिक उपग्रह है।",        category: "space"      },      {        text: "☀️ सूर्य हमारे सौरमंडल का तारा है।",        category: "space"      },      {        text: "🐝 मधुमक्खियाँ फूलों से nectar इकट्ठा करती हैं।",        category: "animals"      },      {        text: "🐘 हाथी अपनी याददाश्त के लिए जाने जाते हैं।",        category: "animals"      }    ];    function showFact() {      const category =        document.getElementById("category").value;      let filteredFacts = facts;      if (category !== "all") {        filteredFacts = facts.filter(          fact => fact.category === category        );      }      const random =        Math.floor(Math.random() * filteredFacts.length);      document.getElementById("fact").innerText =        filteredFacts[random].text;    }    let likes = 0;    function likeFact() {      likes++;      document.getElementById("likes").innerText =        "❤️ Likes: " + likes;    }    function copyFact() {      const fact =        document.getElementById("fact").innerText;      navigator.clipboard.writeText(fact);      alert("📋 Fact copied!");    }    function shareFact() {      const fact =        document.getElementById("fact").innerText;      if (navigator.share) {        navigator.share({          title: "Akash Facts",          text: fact        });      } else {        alert("📤 Share इस browser में उपलब्ध नहीं है।");      }    }    function toggleMode() {      document.body.classList.toggle("light");    }    function addFact() {      const input =        document.getElementById("newFact");      const text = input.value.trim();      if (text === "") {        alert("पहले Fact लिखो!");        return;      }      facts.push({        text: "💡 " + text,        category: "science"      });      input.value = "";      alert("✅ आपका Fact जोड़ दिया गया!");    }    function searchFacts() {      const search =        document.getElementById("searchFact")        .value        .toLowerCase()        .trim();      const results =        facts.filter(fact =>          fact.text.toLowerCase().includes(search)        );      const box =        document.getElementById("results");      if (results.length === 0) {        box.innerText = "❌ कोई Fact नहीं मिला!";        return;      }      box.innerHTML =        results        .map(fact => "💡 " + fact.text)        .join("<br><br>");    }  </script></body></html>
